<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halebop — Kometresan</title>
  <meta name="description" content="Bygg ditt abonnemang medan du följer Halebops komet genom solsystemet. Telefon, abonnemang, bredband och streaming — en resa i taget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="cosmos" aria-hidden="true"></div>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <div class="app">
    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand__comet" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <radialGradient id="ch" cx="35%" cy="30%">
              <stop offset="0%" stop-color="#fff"/>
              <stop offset="45%" stop-color="#ffd36e"/>
              <stop offset="100%" stop-color="#ff2d87"/>
            </radialGradient>
          </defs>
          <path d="M22 10 L6 26 L14 18 Z" fill="#ff2d87" opacity="0.55"/>
          <circle cx="22" cy="10" r="6" fill="url(#ch)"/>
        </svg>
        <span class="brand__name">hale<b>bop</b></span>
      </div>
      <div class="topbar__meta">Kometresan · <span>B-version</span></div>
    </header>

    <!-- Mitten: rail + scen -->
    <div class="stage">
      <nav class="rail" aria-label="Resans planeter">
        <div class="rail__line" aria-hidden="true"></div>
        <div class="comet" id="comet" aria-hidden="true">
          <div class="comet__tail"></div>
          <div class="comet__head"></div>
        </div>
        <div class="rail__planets" id="rail-planets"><!-- byggs i JS --></div>
      </nav>

      <main class="scene" id="scene"><!-- steg byggs i JS --></main>
    </div>

    <!-- Footer / navigation -->
    <footer class="footbar">
      <div class="footbar__inner">
        <div class="tally">
          <span class="tally__label">Din färdplan</span>
          <span class="tally__value" id="tally"><span>0 kr/mån</span></span>
        </div>
        <div class="nav">
          <button class="btn btn--ghost" id="btn-prev">Tillbaka</button>
          <button class="btn btn--primary" id="btn-next">Fortsätt <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
